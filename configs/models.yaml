# Hyperparamètres de référence figés pour la phase B, sans recherche sur le test.
seeds: [42, 43, 44, 45, 46]
ece_bins: 15
random_forest:
  n_estimators: 300
  max_depth: 20
  min_samples_leaf: 1
  class_weight: null
  n_jobs: -1
xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  n_jobs: -1
